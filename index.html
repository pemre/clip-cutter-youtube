<style>
  :root{
    color-scheme: dark;
    --bg:#0b0918; --card:#141026; --card2:#191333; --line:#2b2450;
    --tx:#eae7fa; --tx2:#a49dc9; --tx3:#756e9c;
    --acc:#8b5cff; --acc2:#c084fc; --ok:#3ecf8e; --err:#ff6b81;
    --in:#5eead4; --out:#f0abfc;
    --r:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:28px 20px 64px;background:
      radial-gradient(1200px 600px at 15% -10%, #1b1440 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #2a1236 0%, transparent 55%), var(--bg);
      color:var(--tx); font:15px/1.55 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;}
  .app{max-width:1180px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:20px;margin:0;letter-spacing:-.01em;font-weight:650}
  h1 em{color:var(--acc2);font-style:normal}
  .lede{color:var(--tx2);font-size:14px;margin:0;flex:1}
  .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
        border-radius:var(--r);padding:14px;box-shadow:0 18px 40px -28px #000}
  /* ---------- inputs & buttons ---------- */
  .linkbar{display:flex;gap:10px;flex-wrap:wrap}
  .linkbar input{flex:1 1 320px;min-width:0;padding:12px 14px;border-radius:11px;font-size:15px;
        border:1px solid var(--line);background:#0f0b22;color:var(--tx);transition:border-color .15s,box-shadow .15s}
  .linkbar input:focus,.fname:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #8b5cff33}
  .btn{padding:11px 16px;border-radius:11px;border:1px solid var(--line);background:#221a3e;color:var(--tx);
       font-size:14px;font-weight:550;cursor:pointer;transition:transform .06s,background .15s,border-color .15s;
       white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;
       text-decoration:none}
  .btn:hover{background:#2c2350;border-color:#40376f}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px #8b5cff55}
  .btn.primary{background:linear-gradient(180deg,#9a6bff,#7b4bff);border-color:#9a6bff;color:#fff}
  .btn.primary:hover{background:linear-gradient(180deg,#a97cff,#8a5cff)}
  .btn.small{padding:8px 12px;font-size:13px}
  .btn[disabled]{opacity:.42;cursor:default;transform:none}
  .status{margin-top:10px;font-size:13.5px;color:var(--tx2);min-height:20px;display:flex;gap:8px;align-items:center}
  .status.err{color:var(--err)} .status.ok{color:var(--ok)}
  .spin{width:13px;height:13px;border-radius:50%;border:2px solid #ffffff2e;border-top-color:var(--acc2);
        animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ---------- layout ---------- */
  .grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:14px;margin-top:14px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .stage{position:relative;padding:8px;display:flex}
  video{width:100%;aspect-ratio:16/9;max-height:58vh;object-fit:contain;background:#000;border-radius:10px;display:block}
  .drop{position:absolute;inset:8px;border:2px dashed #4b3f88;border-radius:10px;display:none;
        align-items:center;justify-content:center;background:#0b0918d9;color:var(--tx2);font-size:15px}
  body.dragover .drop{display:flex}
  /* ---------- panel ---------- */
  .panel{display:flex;flex-direction:column;gap:12px}
  .seg{background:#0f0b22;border:1px solid var(--line);border-radius:11px;padding:11px 12px}
  .shead{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;color:var(--tx2);
         font-weight:600;margin-bottom:8px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.in{background:var(--in);box-shadow:0 0 10px var(--in)}
  .dot.out{background:var(--out);box-shadow:0 0 10px var(--out)}
  .segrow{display:flex;align-items:center;gap:12px}
  .segrow > .btn{margin-left:auto;align-self:flex-start;margin-top:2px}
  .t{display:flex;align-items:center;gap:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .t input{width:42px;padding:7px 0;text-align:center;border-radius:7px;font-size:19px;font-family:inherit;
     border:1px solid var(--line);background:#080616;color:var(--tx);font-variant-numeric:tabular-nums}
  .t input[data-u="1"]{width:58px}
  .t input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px #8b5cff44;background:#0c0a1e}
  .t .sep{width:12px;text-align:center;color:#5c5488}
  .units{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:10px;color:var(--tx3);
         text-transform:uppercase;letter-spacing:.08em}
  .units span{width:42px;text-align:center}
  .units span:nth-child(even){width:12px}
  .units span:last-child{width:58px}
  .durcard{background:linear-gradient(135deg,#241a4d,#2f1740);border:1px solid #46377f;border-radius:11px;
           padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .durcard .lbl{font-size:11px;letter-spacing:.16em;color:#c4b8f0;font-weight:600}
  .durcard .val{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  /* ---------- timeline ---------- */
  .tl{margin-top:14px;padding-top:12px}
  .bar{position:relative;height:44px;border-radius:11px;background:#1a1436;border:1px solid var(--line);
       cursor:pointer;touch-action:none;user-select:none}
  .diml,.dimr{position:absolute;top:0;bottom:0;background:#06040fb3;border-radius:11px}
  .sel{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#8b5cff59,#c084fc3d);
       border-top:2px solid var(--acc2);border-bottom:2px solid var(--acc2)}
  .handle{position:absolute;top:-4px;bottom:-4px;width:16px;margin-left:-8px;border-radius:8px;
          background:linear-gradient(180deg,#fff,#cfc4ff);cursor:ew-resize;touch-action:none;
          box-shadow:0 3px 12px #000a,0 0 0 1px #00000040;display:flex;align-items:center;justify-content:center;
          transition:transform .08s,box-shadow .15s}
  .handle::before{content:"";position:absolute;inset:-10px -8px;border-radius:12px}
  .handle i{width:2px;height:14px;background:#6b5bb0;border-radius:2px;box-shadow:3px 0 0 #6b5bb0,-3px 0 0 #6b5bb0}
  .handle.hin{background:linear-gradient(180deg,#eafffb,#7ff1dd)}
  .handle.hout{background:linear-gradient(180deg,#fff0ff,#f0abfc)}
  .handle:hover,.handle:focus-visible{outline:none;box-shadow:0 3px 16px #000b,0 0 0 3px #8b5cff88;transform:scale(1.04)}
  .handle:active{transform:scale(1.07)}
  .head{position:absolute;top:2px;bottom:2px;width:2px;background:#fff;box-shadow:0 0 8px #fff8;pointer-events:none}
  .ghost{position:absolute;top:0;bottom:0;width:1px;background:#ffffff8c;opacity:0;pointer-events:none;
         transition:opacity .1s}
  .ghost.on{opacity:1}
  .tip{position:absolute;bottom:calc(100% + 10px);transform:translateX(-50%);background:#0b0918f2;
       border:1px solid #4a3f85;color:#fff;font-size:12.5px;font-variant-numeric:tabular-nums;
       padding:4px 8px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .12s;pointer-events:none}
  .tip.on{opacity:1}
  .scale{position:relative;height:16px;margin-top:6px;font-size:10.5px;color:var(--tx3);
         font-variant-numeric:tabular-nums}
  .scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;
        font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums}
  .hint{color:var(--tx3);font-size:12.5px}
  .tl.empty .handle{opacity:.3} .tl.empty .bar{cursor:default}
  /* ---------- command / cut ---------- */
  .cmd{margin-top:14px}
  .cmdhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
           font-size:11px;letter-spacing:.16em;color:var(--tx2);font-weight:600}
  .cmdrow{display:flex;gap:8px;align-items:center;flex:1 1 420px;justify-content:flex-end}
  .fname{flex:1 1 200px;min-width:140px;padding:8px 11px;border-radius:9px;font-size:13px;
         border:1px solid var(--line);background:#0f0b22;color:var(--tx);letter-spacing:0;font-weight:450}
  pre{margin:10px 0 0;background:#080616;border:1px solid var(--line);border-radius:10px;padding:12px;
      white-space:pre-wrap;word-break:break-all;font-size:12.5px;color:#cfc7f0;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .prog{height:8px;border-radius:99px;background:#0f0b22;border:1px solid var(--line);
        margin-top:12px;overflow:hidden;display:none}
  .prog.on{display:block}
  .prog > div{height:100%;width:0;background:linear-gradient(90deg,#7b4bff,#c084fc);transition:width .3s}
  .progtext{margin-top:8px;font-size:13px;color:var(--tx2);display:none}
  .progtext.on{display:block}
  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1d1740;
         border:1px solid #4a3f85;color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;
         opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 10px 30px -12px #000;
         display:flex;gap:8px;align-items:center;z-index:20}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  /* ---------- demo banner ---------- */
  .banner{margin-top:14px;border-color:#4a3f85;background:linear-gradient(135deg,#241a4d,#1c1330);
          display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--tx2)}
  .banner b{color:var(--tx)}
  .banner code{background:#080616;border:1px solid var(--line);border-radius:7px;padding:3px 7px;
               font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfc7f0;font-size:12.5px}
</style>
<div class="app">
  <header>
    <h1>✂️ <span data-t="brand">Klip Kesici</span></h1>
    <p class="lede" data-t="tagline"></p>
    <a class="btn small" id="gh" href="https://github.com/pemre/clip-cutter-youtube" target="_blank" rel="noopener">
      <span aria-hidden="true">★</span><span data-t="github"></span>
    </a>
    <button class="btn small" id="lang">EN</button>
  </header>

  <div class="card banner" id="banner" hidden>
    <b data-t="demoTitle"></b>
    <span data-t="demoBody"></span>
    <code>python3 server.py</code>
    <a class="btn small" href="https://github.com/pemre/clip-cutter-youtube#run-it-locally"
       target="_blank" rel="noopener" data-t="readMore"></a>
  </div>

  <div class="card">
    <div class="linkbar">
      <input id="url" type="url" data-t-ph="urlPlaceholder" placeholder="https://www.youtube.com/watch?v=…" spellcheck="false" autocomplete="off">
      <button class="btn primary" id="load" data-t="load"></button>
      <button class="btn" id="pickBtn" data-t="pick"></button>
      <input id="pick" type="file" accept="video/*" hidden>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="grid">
    <div class="card stage">
      <video id="player" controls playsinline preload="auto"></video>
      <div class="drop" data-t="drop"></div>
    </div>

    <div class="card panel">
      <div class="seg">
        <div class="shead"><span class="dot in"></span><span data-t="start"></span></div>
        <div class="segrow">
          <div>
            <div class="t" id="tIn">
              <input id="hin" maxlength="2" value="00" data-u="3600000"><span class="sep">:</span>
              <input id="min" maxlength="2" value="00" data-u="60000"><span class="sep">:</span>
              <input id="sin" maxlength="2" value="00" data-u="1000"><span class="sep">.</span>
              <input id="msin" maxlength="3" value="000" data-u="1">
            </div>
            <div class="units">
              <span data-t="uH"></span><span></span><span data-t="uM"></span><span></span>
              <span data-t="uS"></span><span></span><span data-t="uMs"></span>
            </div>
          </div>
          <button class="btn small" id="setIn" data-t="useIn"></button>
        </div>
      </div>

      <div class="seg">
        <div class="shead"><span class="dot out"></span><span data-t="end"></span></div>
        <div class="segrow">
          <div>
            <div class="t" id="tOut">
              <input id="hout" maxlength="2" value="00" data-u="3600000"><span class="sep">:</span>
              <input id="mout" maxlength="2" value="00" data-u="60000"><span class="sep">:</span>
              <input id="sout" maxlength="2" value="00" data-u="1000"><span class="sep">.</span>
              <input id="msout" maxlength="3" value="000" data-u="1">
            </div>
            <div class="units">
              <span data-t="uH"></span><span></span><span data-t="uM"></span><span></span>
              <span data-t="uS"></span><span></span><span data-t="uMs"></span>
            </div>
          </div>
          <button class="btn small" id="setOut" data-t="useOut"></button>
        </div>
      </div>

      <div class="durcard">
        <div class="lbl" data-t="selected"></div>
        <div class="val" id="durSel">—</div>
      </div>

      <button class="btn" id="preview" data-t="preview"></button>
    </div>
  </div>

  <div class="card tl empty" id="tl">
    <div class="bar" id="bar">
      <div class="diml" id="diml"></div><div class="dimr" id="dimr"></div>
      <div class="sel" id="sel"></div>
      <div class="ghost" id="ghost"></div>
      <div class="handle hin" id="hIn" data-drag="in" tabindex="0" role="slider" aria-label="Start"><i></i></div>
      <div class="handle hout" id="hOut" data-drag="out" tabindex="0" role="slider" aria-label="End"><i></i></div>
      <div class="head" id="head"></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="scale" id="scale"></div>
    <div class="meta">
      <span id="pos">00:00:00.000</span>
      <span class="hint" data-t="hint"></span>
    </div>
  </div>

  <div class="card cmd">
    <div class="cmdhead">
      <span data-t="cmdLabel"></span>
      <div class="cmdrow">
        <input class="fname" id="fname" spellcheck="false">
        <button class="btn small" id="copy" data-t="copy"></button>
        <button class="btn small primary" id="cut" data-t="cut"></button>
      </div>
    </div>
    <pre id="cmdOut"></pre>
    <div class="prog" id="prog"><div id="pfill"></div></div>
    <div class="progtext" id="ptext"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ---------------- i18n ---------------- */
const TEXT = {
  tr: {
    brand: 'Klip Kesici', tagline: 'Linki yapıştır → iki ucu sürükle → klibi indir.',
    github: 'GitHub', readMore: 'Nasıl çalıştırılır?',
    title: 'Clip Cutter · YouTube klip kesici',
    demoTitle: 'Statik demo —',
    demoBody: 'video hazırlama ve kesim sunucuda olur: YouTube akışı tarayıcıdan çekilemez (CORS + imzalı URL) ve kesim ffmpeg ister. Yerelde tek komut:',
    demoNeedsServer: 'Bu sayfa statik demo; video hazırlama için yerel sunucu gerekir (README → Run it locally).',
    sampleVideo: 'Örnek video — sürgüleri deneyebilirsin',
    urlPlaceholder: 'https://www.youtube.com/watch?v=…',
    load: 'Yükle', pick: 'Dosya seç', drop: 'Videoyu buraya bırak',
    start: 'BAŞLANGIÇ', end: 'BİTİŞ',
    useIn: '⏱ Başlangıç = şu an', useOut: '⏱ Bitiş = şu an',
    preview: '▶ Önizleme', selected: 'SEÇİLİ SÜRE', cmdLabel: 'KOMUT',
    copy: 'Kopyala', copied: 'Kopyalandı ✓', cut: 'Klibi kes', download: 'İndir',
    hint: 'Boşluk: oynat/duraklat · ←→ ±1sn · Shift+←→ ±10sn · I/O işaretle',
    uH: 'sa', uM: 'dk', uS: 'sn', uMs: 'ms',
    ready: f => `Hazır: ${f}`,
    loading: s => `Video hazırlanıyor… ${s} sn (ilk seferde bir kez indirilir)`,
    notYoutube: 'Bu bir YouTube linki değil.',
    invalidRange: '⚠︎ geçersiz aralık',
    fixRange: '# başlangıç ≥ bitiş — aralığı düzelt',
    startSet: t => `Başlangıç: ${t}`, endSet: t => `Bitiş: ${t}`,
    copiedToast: 'Komut panoya kopyalandı',
    cutting: p => `Kesiliyor… %${p}`, cutQueued: 'Kesim başladı',
    cutDone: f => `Klip hazır: ${f}`, cutFailed: 'Kesim hatası: ',
    videoError: 'Video açılamadı.',
    localCut: 'Yerel dosya için ffmpeg komutunu kullan.'
  },
  en: {
    brand: 'Clip Cutter', tagline: 'Paste a link → drag the handles → download the clip.',
    github: 'GitHub', readMore: 'How to run it',
    title: 'Clip Cutter · YouTube clip cutter',
    demoTitle: 'Static demo —',
    demoBody: 'preparing and cutting the video happens on a server: a browser cannot pull a YouTube stream (CORS + signed URLs) and cutting needs ffmpeg. One command locally:',
    demoNeedsServer: 'This page is a static demo; preparing a video needs the local server (README → Run it locally).',
    sampleVideo: 'Sample video — try the handles',
    urlPlaceholder: 'https://www.youtube.com/watch?v=…',
    load: 'Load', pick: 'Choose file', drop: 'Drop a video here',
    start: 'START', end: 'END',
    useIn: '⏱ Start = now', useOut: '⏱ End = now',
    preview: '▶ Preview', selected: 'SELECTED LENGTH', cmdLabel: 'COMMAND',
    copy: 'Copy', copied: 'Copied ✓', cut: 'Cut clip', download: 'Download',
    hint: 'Space: play/pause · ←→ ±1s · Shift+←→ ±10s · I/O set point',
    uH: 'h', uM: 'm', uS: 's', uMs: 'ms',
    ready: f => `Ready: ${f}`,
    loading: s => `Preparing video… ${s}s (downloaded once, first time only)`,
    notYoutube: 'That is not a YouTube link.',
    invalidRange: '⚠︎ invalid range',
    fixRange: '# start ≥ end — fix the range',
    startSet: t => `Start: ${t}`, endSet: t => `End: ${t}`,
    copiedToast: 'Command copied to clipboard',
    cutting: p => `Cutting… ${p}%`, cutQueued: 'Cut started',
    cutDone: f => `Clip ready: ${f}`, cutFailed: 'Cut failed: ',
    videoError: 'Could not open the video.',
    localCut: 'Use the ffmpeg command for local files.'
  }
};
let lang = localStorage.getItem('klipLang') || 'tr';
const L = () => TEXT[lang];

// GitHub Pages (or ?demo) → static demo: no server, so no video prep and no cutting.
const DEMO = /(^|\.)github\.io$/.test(location.hostname) ||
             new URLSearchParams(location.search).has('demo');
const SAMPLE_VIDEO = 'https://media.w3.org/2010/05/sintel/trailer.mp4';

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const player = $('player');
const tIn = $('tIn'), tOut = $('tOut');
const bar = $('bar'), hIn = $('hIn'), hOut = $('hOut'), tip = $('tip'), ghost = $('ghost');
const pad = (n, w = 2) => String(n).padStart(w, '0');

const fmt = ms => {                              // 00:22:17.364
  ms = Math.max(0, Math.round(ms));
  return `${pad(Math.floor(ms / 3600000))}:${pad(Math.floor(ms % 3600000 / 60000))}:` +
         `${pad(Math.floor(ms % 60000 / 1000))}.${pad(ms % 1000, 3)}`;
};
const nice = ms => {                             // 10 dk 50 sn
  const s = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  const hu = lang === 'tr' ? 'sa' : 'h', mu = lang === 'tr' ? 'dk' : 'm', su = lang === 'tr' ? 'sn' : 's';
  return (h ? `${h} ${hu} ` : '') + (h || m ? `${m} ${mu} ` : '') + `${sec} ${su}`;
};
const readFields = c => [...c.querySelectorAll('input')]
  .reduce((sum, i) => sum + (+i.value || 0) * +i.dataset.u, 0);
const writeFields = (c, ms) => {
  ms = Math.max(0, Math.round(ms));
  const b = c.querySelectorAll('input');
  b[0].value = pad(Math.floor(ms / 3600000));
  b[1].value = pad(Math.floor(ms % 3600000 / 60000));
  b[2].value = pad(Math.floor(ms % 60000 / 1000));
  b[3].value = pad(ms % 1000, 3);
};
const youtubeId = u => (String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || [])[1];
const durationMs = () => (isFinite(player.duration) ? player.duration * 1000 : 0);
const clampMs = ms => Math.min(Math.max(0, ms), durationMs() || 1e12);
const slug = s => String(s || '').toLowerCase()
  .replace(/[çğıöşü]/g, c => ({ç:'c',ğ:'g',ı:'i',ö:'o',ş:'s',ü:'u'})[c])
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'clip';

let IN = 0, OUT = 0;
let currentTitle = '';

/* ---------------- feedback ---------------- */
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}
let lastStatus = { kind: '', key: '', args: [] };
function status(kind, key, ...args) {
  lastStatus = { kind, key, args };
  renderStatus();
}
function renderStatus() {
  const { kind, key, args } = lastStatus;
  const box = $('status');
  box.className = 'status' + (kind ? ' ' + kind : '');
  box.innerHTML = (kind === 'wait' ? '<span class="spin"></span>' : '') +
                  (kind === 'ok' ? '<span style="color:var(--ok)">✓</span>' : '') +
                  (kind === 'err' ? '<span>⚠︎</span>' : '');
  const span = document.createElement('span');
  const entry = L()[key];
  span.textContent = typeof entry === 'function' ? entry(...args) : (entry ?? key ?? '');
  box.appendChild(span);
}

/* ---------------- render ---------------- */
function paint() {
  const d = durationMs() || 1;
  const pi = IN / d * 100, po = OUT / d * 100;
  $('sel').style.left = pi + '%';
  $('sel').style.width = Math.max(0, po - pi) + '%';
  $('diml').style.left = '0'; $('diml').style.width = pi + '%';
  $('dimr').style.left = po + '%'; $('dimr').style.width = Math.max(0, 100 - po) + '%';
  hIn.style.left = pi + '%'; hOut.style.left = po + '%';
  $('head').style.left = ((player.currentTime * 1000) / d * 100) + '%';
  $('tl').classList.toggle('empty', !durationMs());

  // never rewrite a focused field: it would yank the text caret
  const active = document.activeElement;
  if (!tIn.contains(active)) writeFields(tIn, IN);
  if (!tOut.contains(active)) writeFields(tOut, OUT);

  const bad = durationMs() && OUT <= IN;
  $('durSel').textContent = bad ? L().invalidRange : (durationMs() ? nice(OUT - IN) : '—');
  $('pos').textContent = `${fmt(player.currentTime * 1000)} / ${durationMs() ? fmt(durationMs()) : '—'}`;
  hIn.setAttribute('aria-valuetext', fmt(IN));
  hOut.setAttribute('aria-valuetext', fmt(OUT));

  // "set point" buttons are pointless when the field already equals the playhead
  const now = Math.round(player.currentTime * 1000);
  $('setIn').disabled = !durationMs() || now === IN;
  $('setOut').disabled = !durationMs() || now === OUT;
  $('preview').disabled = !durationMs();
  $('cut').disabled = cutRunning || (!DEMO && (!youtubeId($('url').value) || bad));

  const id = youtubeId($('url').value);
  $('cmdOut').textContent = bad
    ? L().fixRange
    : id
    ? `yt-dlp --download-sections "*${fmt(IN)}-${fmt(OUT)}" --force-keyframes-at-cuts \\\n` +
      `  -f "bv*[height<=1080]+ba/b" --merge-output-format mp4 \\\n` +
      `  -o "clip.%(ext)s" "https://www.youtube.com/watch?v=${id}"`
    : `ffmpeg -ss ${fmt(IN)} -to ${fmt(OUT)} -i "source.mp4" -c copy "clip.mp4"`;
}

function setSide(side, ms, seek, hard = true) {
  ms = hard ? clampMs(Math.round(ms)) : Math.max(0, Math.round(ms));
  if (side === 'in') IN = ms; else OUT = ms;
  paint();
  if (seek) player.currentTime = ms / 1000;
}

/* ---------------- time fields ---------------- */
[tIn, tOut].forEach(container => {
  const side = container === tIn ? 'in' : 'out';
  container.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', () => setSide(side, readFields(container), false, false));
    input.addEventListener('focus', () => input.select());
    input.addEventListener('blur', () => setSide(side, readFields(container), false));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { setSide(side, readFields(container), true); input.blur(); return; }
      const dir = e.key === 'ArrowUp' ? 1 : e.key === 'ArrowDown' ? -1 : 0;
      if (!dir) return;
      e.preventDefault();
      const step = +input.dataset.u * (e.shiftKey ? 10 : 1) * dir;
      setSide(side, clampMs(readFields(container) + step), true);
      writeFields(container, side === 'in' ? IN : OUT);
      input.select();
    });
  });
});

/* ---------------- timeline ---------------- */
let dragging = null;                       // 'in' | 'out' | 'head'
const msAt = e => {
  const rect = bar.getBoundingClientRect();
  return Math.min(durationMs(), Math.max(0, (e.clientX - rect.left) / rect.width * durationMs()));
};
function showTip(clientX, ms) {
  const rect = bar.getBoundingClientRect();
  tip.textContent = fmt(ms);
  tip.style.left = ((clientX - rect.left) / rect.width * 100) + '%';
  tip.classList.add('on');
}
[hIn, hOut].forEach(handle => {
  const side = handle.dataset.drag;
  handle.addEventListener('pointerdown', e => {
    if (!durationMs()) return;
    dragging = side;
    handle.setPointerCapture(e.pointerId);
    e.preventDefault(); e.stopPropagation();
  });
  handle.addEventListener('pointermove', e => {
    if (dragging !== side) return;
    const ms = msAt(e);
    if (side === 'in') setSide('in', Math.min(ms, OUT), true);
    else setSide('out', Math.max(ms, IN), true);
    showTip(e.clientX, side === 'in' ? IN : OUT);
  });
  handle.addEventListener('pointerup', e => {
    dragging = null;
    handle.releasePointerCapture(e.pointerId);
    tip.classList.remove('on');
  });
  handle.addEventListener('keydown', e => {
    const dir = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
    if (!dir) return;
    e.preventDefault();
    const base = side === 'in' ? IN : OUT;
    const ms = clampMs(base + dir * (e.shiftKey ? 10000 : 1000));
    setSide(side, side === 'in' ? Math.min(ms, OUT) : Math.max(ms, IN), true);
    showTip(bar.getBoundingClientRect().left + 1, side === 'in' ? IN : OUT);
    setTimeout(() => tip.classList.remove('on'), 900);
  });
});
bar.addEventListener('pointerdown', e => {
  if (!durationMs()) return;
  dragging = 'head';
  bar.setPointerCapture(e.pointerId);
  player.currentTime = msAt(e) / 1000;
});
bar.addEventListener('pointermove', e => {
  if (!durationMs()) return;
  if (dragging === 'head') {
    player.currentTime = msAt(e) / 1000;
    showTip(e.clientX, msAt(e));
    return;
  }
  if (dragging) return;
  // hover: ghost line + time tip so you know where you are before clicking
  const rect = bar.getBoundingClientRect();
  const x = Math.min(rect.width, Math.max(0, e.clientX - rect.left));
  ghost.style.left = (x / rect.width * 100) + '%';
  ghost.classList.add('on');
  showTip(e.clientX, x / rect.width * durationMs());
});
bar.addEventListener('pointerleave', () => {
  if (dragging) return;
  ghost.classList.remove('on');
  tip.classList.remove('on');
});
bar.addEventListener('pointerup', e => { dragging = null; tip.classList.remove('on'); });

/* ---------------- player ---------------- */
player.addEventListener('loadedmetadata', () => {
  if (!durationMs()) return;
  IN = 0; OUT = durationMs();
  drawScale();
  paint();
});
player.addEventListener('timeupdate', paint);
player.addEventListener('seeked', paint);
player.addEventListener('error', () => { if (!durationMs()) status('err', 'videoError'); });

function drawScale() {
  const total = durationMs();
  $('scale').innerHTML = '';
  if (!total) return;
  for (let i = 0; i <= 5; i++) {
    const span = document.createElement('span');
    span.style.left = (i * 20) + '%';
    span.style.transform = i === 0 ? 'none' : i === 5 ? 'translateX(-100%)' : 'translateX(-50%)';
    span.textContent = fmtNiceShort(total * i / 5);
    $('scale').appendChild(span);
  }
}
function fmtNiceShort(ms) {
  const s = Math.round(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (lang === 'tr') return (h ? `${h} sa ` : '') + (h || m ? `${m} dk ` : '') + `${sec} sn`;
  return (h ? `${h}:` : '') + `${pad(m)}:${pad(sec)}`;
}

/* ---------------- load ---------------- */
async function loadUrl() {
  if (DEMO) { status('err', 'demoNeedsServer'); return; }
  const url = $('url').value.trim();
  if (!youtubeId(url)) { status('err', 'notYoutube'); $('url').focus(); return; }
  const started = Date.now();
  $('load').disabled = true;
  const tick = setInterval(() => status('wait', 'loading', Math.round((Date.now() - started) / 1000)), 400);
  status('wait', 'loading', 0);
  try {
    const res = await fetch('/api/preview?url=' + encodeURIComponent(url));
    const data = await res.json();
    clearInterval(tick);
    $('load').disabled = false;
    if (data.error) { status('err', 'cutFailed', data.error); return; }
    player.src = data.src;
    player.load();
    currentTitle = data.title || '';
    if (!/^$/.test($('fname').value.trim())) $('fname').value = $('fname').value.trim();
    else $('fname').value = slug(currentTitle) + '.mp4';
    status('ok', 'ready', currentTitle);
  } catch (err) {
    clearInterval(tick);
    $('load').disabled = false;
    status('err', 'cutFailed', err.message);
  }
}

function openFile(file) {
  if (!file) return;
  $('url').value = '';
  currentTitle = file.name.replace(/\.[^.]+$/, '');
  $('fname').value = slug(currentTitle) + '.mp4';
  player.src = URL.createObjectURL(file);
  player.load();
  status('ok', 'ready', file.name);
  toast(L().localCut);
}

$('load').onclick = loadUrl;
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') loadUrl(); });
$('url').addEventListener('input', paint);
$('pickBtn').onclick = () => $('pick').click();
$('pick').addEventListener('change', e => openFile(e.target.files[0]));

['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); document.body.classList.add('dragover');
}));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault();
  if (ev === 'drop') openFile(e.dataTransfer.files[0]);
  document.body.classList.remove('dragover');
}));

/* ---------------- actions ---------------- */
$('setIn').onclick = () => {
  setSide('in', player.currentTime * 1000, false);
  toast(L().startSet(fmt(IN)));
};
$('setOut').onclick = () => {
  setSide('out', player.currentTime * 1000, false);
  toast(L().endSet(fmt(OUT)));
};
$('preview').onclick = () => { player.currentTime = IN / 1000; player.play(); };
$('setIn').onmouseenter = $('setOut').onmouseenter = paint;

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('cmdOut').textContent); } catch (e) {}
  const btn = $('copy');
  btn.textContent = L().copied;
  setTimeout(() => btn.textContent = L().copy, 1600);
  toast(L().copiedToast);
};

/* ---------------- server-side cut ---------------- */
let cutRunning = false, pollTimer = null;

$('cut').onclick = async () => {
  if (DEMO) { toast(L().demoNeedsServer); return; }
  const url = $('url').value.trim();
  if (!youtubeId(url) || cutRunning) return;
  const name = ($('fname').value.trim() || slug(currentTitle)).replace(/[^\w\-. ()]+/g, '_');
  cutRunning = true;
  paint();
  $('prog').classList.add('on');
  $('ptext').classList.add('on');
  $('ptext').style.color = '';
  $('pfill').style.width = '0%';
  $('ptext').textContent = L().cutting(0);
  toast(L().cutQueued);
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();

  try {
    const res = await fetch('/api/cut', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, start: IN / 1000, end: OUT / 1000, name })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    pollCut(data.id);
  } catch (err) {
    finishCut(err.message);
  }
};

function pollCut(id) {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const job = await (await fetch('/api/job?id=' + id)).json();
      $('pfill').style.width = (job.progress || 0) + '%';
      $('ptext').textContent = L().cutting(job.progress || 0);
      if (job.state === 'done') {
        finishCut(null, job.file);
      } else if (job.state === 'error') {
        finishCut(job.error);
      }
    } catch (err) {
      finishCut(err.message);
    }
  }, 800);
}

function finishCut(error, file) {
  clearInterval(pollTimer);
  cutRunning = false;
  paint();
  if (error) {
    $('ptext').textContent = L().cutFailed + error;
    $('ptext').style.color = 'var(--err)';
    return;
  }
  $('pfill').style.width = '100%';
  $('ptext').style.color = '';
  $('ptext').textContent = L().cutDone(file);
  toast(L().cutDone(file));
  const link = document.createElement('a');
  link.className = 'btn small primary dl-link';
  link.style.marginTop = '10px';
  link.href = '/out/' + encodeURIComponent(file);
  link.download = file;
  link.textContent = L().download;
  document.querySelectorAll('.dl-link').forEach(node => node.remove());
  $('ptext').after(link);
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(L().cutDone(file), { body: location.host });
  }
}

/* ---------------- keyboard ---------------- */
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === ' ' && !typing) { e.preventDefault(); player.paused ? player.play() : player.pause(); return; }
  if (typing) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    player.currentTime = Math.min(durationMs() / 1000, Math.max(0,
      player.currentTime + (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 10 : 1)));
  }
  if (e.key === 'i' || e.key === 'I') $('setIn').click();
  if (e.key === 'o' || e.key === 'O') $('setOut').click();
});

/* ---------------- language ---------------- */
function applyLang() {
  const t = L();
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => {
    const value = t[el.dataset.t];
    if (typeof value === 'string') el.textContent = value;
  });
  document.querySelectorAll('[data-t-ph]').forEach(el => {
    el.placeholder = t[el.dataset.tPh] || '';
  });
  $('lang').textContent = lang === 'tr' ? 'EN' : 'TR';
  document.title = t.title;
  renderStatus();
  drawScale();
  paint();
}
$('lang').onclick = () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  localStorage.setItem('klipLang', lang);
  applyLang();
};

$('fname').value = 'klip.mp4';
applyLang();

if (DEMO) {
  $('banner').hidden = false;
  player.src = SAMPLE_VIDEO;
  player.load();
  currentTitle = '';
  $('fname').value = 'demo-clip.mp4';
  status('ok', 'sampleVideo');
}
</script>
</html>
